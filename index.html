<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f1" />
    <meta
      name="description"
      content="Central Hub — the club's project directory and team hub. Every card is a tool we built that you can open."
    />
    <title>Central Hub</title>
    <script>
      // No-flash theme: apply the saved/system theme before first paint.
      // Paper (light) is the default when nothing is stored.
      (function () {
        try {
          var stored = localStorage.getItem('central-hub-theme') || 'light';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
