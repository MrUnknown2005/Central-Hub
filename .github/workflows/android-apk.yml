name: Build Android APK

# Two ways to build:
#   • "Run workflow" button (workflow_dispatch) → builds an APK and attaches it to the
#     run as a downloadable artifact. Good for quick test builds.
#   • Push a version tag like v1.0.0 → builds AND publishes a GitHub Release with the
#     APK attached, so you get a permanent shareable download link.
#
# Signing: if the ANDROID_KEYSTORE_BASE64 secret is set, the release APK is signed with
# your key (installable + updatable in place). Until then, the workflow falls back to an
# unsigned debug APK so you can still get something on a phone. See README for setup.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Cancel an in-progress run if a newer one starts on the same ref.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create a GitHub Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Detect signing config
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — building an UNSIGNED debug APK. Add the keystore secrets to get a signed release APK (see README)."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compute version name
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate the built APK
        id: apk
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            src="android/app/build/outputs/apk/release/app-release.apk"
          else
            src="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          out="MLC-Central-Hub-${{ steps.ver.outputs.name }}.apk"
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlc-central-hub-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.file }}" \
            --title "MLC Central Hub ${GITHUB_REF_NAME}" \
            --notes "Download the APK below. On your phone, open it and allow installs from your browser/Files app when prompted, then tap Install."
